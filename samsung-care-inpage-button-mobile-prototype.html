<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samsung Care+ In-Page Button — Mobile Prototype</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #ffffff;
    font-family: "SamsungOne", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page-wrap {
    max-width: 375px;
    margin: 0 auto;
    position: relative;
  }
  .page-wrap img.page {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* ============================================================
     IN-PAGE CARE+ BUTTON (mobile) — anchored in the reserved
     space above the Samsung Care+ section; scrolls with the page
     ============================================================ */
  .care-btn-anchor {
    position: absolute;
    /* centre of the reserved space above the Care+ heading
       (~y4146 on the 375x7874 page) — tweak to move the button */
    top: 52.65%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
  }

  .care-btn {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 11px 18px 11px 15px;
    border-radius: 999px;
    border: 1px solid transparent;
    cursor: pointer;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    color: #010101;
    letter-spacing: -0.3px;
    white-space: nowrap;

    /* colourful state (default when it arrives) */
    background:
      linear-gradient(90deg, #dcdbfa 0%, #d9e0f3 32%, #d6e5ec 58%, #d5e9e7 78%, #d3ece3 100%);
    box-shadow: 0 8px 24px rgba(80, 90, 160, 0.22), 0 2px 6px rgba(0,0,0,0.08);

    /* hidden until the user reaches this part of the page */
    opacity: 0;
    transform: translateY(-14px) scale(0.5);
    transform-origin: 50% 0;
    pointer-events: none;

    transition:
      background 0.9s ease,
      border-color 0.9s ease,
      box-shadow 0.9s ease;
  }

  /* grow IN — smooth scale-up, no overshoot */
  .care-btn.entering {
    animation: careGrowIn 0.55s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
    pointer-events: auto;
  }
  @keyframes careGrowIn {
    0%   { transform: translateY(-14px) scale(0.5); opacity: 0; }
    100% { transform: translateY(0)     scale(1);   opacity: 1; }
  }

  /* revealed — stays in the page from here on */
  .care-btn.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  /* settled state — fades to plain white with outline */
  .care-btn.settled {
    background: linear-gradient(90deg, #ffffff 0%, #ffffff 100%);
    border-color: #010101;
    box-shadow: 0 3px 10px rgba(0,0,0,0.10);
  }

  .care-btn.visible:active { transform: scale(0.97); }

  .care-btn .heart {
    width: 26px;
    height: 21px;
    flex-shrink: 0;
  }

  .care-btn .plus {
    font-weight: 700;
    font-size: 19px;
    line-height: 1;
    margin-left: 7px;
    transition: margin-left 0.9s ease, font-size 0.9s ease;
  }
  .care-btn.settled .plus {
    margin-left: -4px;
    font-size: 15px;
  }

  /* ============================================================
     STICKY WIDGETS — live commerce (bottom-left) & chat (right)
     Anchored to the 375px page column when viewed on wider screens.
     ============================================================ */
  .live-widget {
    position: fixed;
    left: 10px;
    bottom: 10px;
    width: 106px;
    z-index: 850;
    cursor: pointer;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    opacity: 0;
    transform: translateY(16px);
    animation: widgetIn 0.5s ease 0.4s forwards;
  }
  .live-widget img { display: block; width: 100%; height: auto; }

  .chat-widget {
    position: fixed;
    right: 15px;
    bottom: 200px;
    width: 56px;
    height: 56px;
    z-index: 850;
    cursor: pointer;
    opacity: 0;
    transform: translateY(16px);
    animation: widgetIn 0.5s ease 0.6s forwards;
  }
  .chat-widget img { display: block; width: 100%; height: auto; }

  @keyframes widgetIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* keep the widgets glued to the phone-width column on wider screens */
  @media (min-width: 376px) {
    .live-widget { left: calc(50vw - 187.5px + 10px); }
    .chat-widget { right: calc(50vw - 187.5px + 15px); }
  }

  /* ============================================================
     STICKY BUY BAR — pinned to the bottom, slight shadow,
     sits BEHIND the live commerce and chat widgets (lower z-index)
     ============================================================ */
  .buy-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 375px;
    max-width: 100vw;
    z-index: 800;              /* live commerce & chat are 850 */
    background: #ffffff;
    box-shadow: 0 -4px 14px rgba(0, 0, 0, 0.10);
  }
  .buy-bar img { display: block; width: 100%; height: auto; }

  /* ============================================================
     POPUP / MODAL (mobile-friendly)
     ============================================================ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    padding: 14px;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .modal {
    background: #ffffff;
    border-radius: 16px;
    width: min(420px, 100%);
    max-height: calc(100vh - 28px);
    overflow-y: auto;
    padding: 46px 22px 34px;
    position: relative;
    transform: translateY(24px) scale(0.97);
    transition: transform 0.35s cubic-bezier(0.22, 1.2, 0.36, 1);
  }
  .modal-overlay.open .modal {
    transform: translateY(0) scale(1);
  }

  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 30px;
    height: 30px;
    border: none;
    background: none;
    cursor: pointer;
    padding: 4px;
    z-index: 2;
  }
  .modal-close svg { width: 100%; height: 100%; }

  .modal h2 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.4px;
    color: #010101;
    margin-bottom: 20px;
  }

  .modal .video-frame {
    width: min(240px, 62vw);
    aspect-ratio: 9 / 16;
    margin: 0 auto 22px;
    border-radius: 12px;
    overflow: hidden;
    background: #f4f6f8;
    box-shadow: 0 6px 24px rgba(0,0,0,0.12);
  }
  .modal .video-frame iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  .modal p {
    font-size: 15px;
    line-height: 1.5;
    color: #010101;
  }
</style>
</head>

  <!-- Popup -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <button class="modal-close" id="modalClose" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="#010101" stroke-width="1.6" stroke-linecap="round">
          <line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/>
        </svg>
      </button>
      <h2 id="modalTitle">Samsung Care+ for your new Galaxy</h2>
      <div class="video-frame" id="videoFrame" data-src="https://www.youtube.com/embed/gzzMMt7KYTE?autoplay=1"></div>
      <p>Get peace of mind for your Samsung Galaxy, with worldwide cover designed by the people who made it.</p>
    </div>
  </div>

<script>
(function () {
  /* ------------------------------------------------------------
     CONFIG — the button's position on the page is set in CSS
     (.care-btn-anchor { top: 52.65% }). Tweak these to change
     when the reveal fires and how long it stays colourful.
  ------------------------------------------------------------ */
  var REVEAL_VIEWPORT_FRAC = 0.75; // reveal when the button rises above this fraction of the viewport
  var WHITE_DELAY_MS  = 1600;      // how long the button stays colourful before settling to white

  var btn      = document.getElementById('careBtn');
  var pageImg  = document.getElementById('pageImg');
  var overlay  = document.getElementById('modalOverlay');
  var closeBtn = document.getElementById('modalClose');
  var videoFrame = document.getElementById('videoFrame');
  var chatWidget = document.getElementById('chatWidget');

  var revealed = false;

  function btnDocTop() {
    var rect = btn.parentNode.getBoundingClientRect();
    return rect.top + window.scrollY;
  }

  function reveal(instant) {
    if (revealed) return;
    revealed = true;
    btn.setAttribute('aria-hidden', 'false');
    if (instant) {
      // page loaded already scrolled past the button — no animation
      btn.classList.add('visible', 'settled');
      return;
    }
    btn.classList.add('entering');
    setTimeout(function () {
      btn.classList.remove('entering');
      btn.classList.add('visible');
    }, 560);
    setTimeout(function () {
      btn.classList.add('settled');
    }, WHITE_DELAY_MS);
  }

  function onScroll() {
    if (revealed) return;
    var top = btnDocTop();
    if (top < window.scrollY) {
      reveal(true);  // already above the viewport
    } else if (window.scrollY + window.innerHeight * REVEAL_VIEWPORT_FRAC >= top) {
      reveal(false); // user has reached this part of the page
    }
  }

  var ticking = false;
  window.addEventListener('scroll', function () {
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(function () { onScroll(); ticking = false; });
    }
  }, { passive: true });
  window.addEventListener('resize', onScroll);
  window.addEventListener('load', onScroll);
  onScroll();

  /* ---------------- chat widget: X in the corner dismisses it ---------------- */
  chatWidget.addEventListener('click', function (e) {
    var r = chatWidget.getBoundingClientRect();
    // the close X occupies the top-right corner of the asset
    if (e.clientX > r.right - 22 && e.clientY < r.top + 22) {
      chatWidget.style.display = 'none';
    }
  });

  /* ---------------- popup ---------------- */
  function openModal() {
    if (!videoFrame.querySelector('iframe')) {
      var f = document.createElement('iframe');
      f.src = videoFrame.getAttribute('data-src');
      f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      f.allowFullscreen = true;
      f.setAttribute('frameborder', '0');
      f.title = 'Samsung Care+ video';
      videoFrame.appendChild(f);
    }
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    overlay.classList.remove('open');
    document.body.style.overflow = '';
    var f = videoFrame.querySelector('iframe');
    if (f) f.remove();
  }

  btn.addEventListener('click', openModal);
  closeBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });
})();
</script>
