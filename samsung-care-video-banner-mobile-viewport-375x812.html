<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samsung Care+ Video Banner — Mobile Prototype (375×812 viewport)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #eceef0;
    font-family: "SamsungOne", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 0;
  }

  /* ---- 375×812 mobile viewport frame ---- */
  .phone {
    position: relative;
    width: 375px;
    height: 812px;
    flex-shrink: 0;
    background: #ffffff;
    border-radius: 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.22), 0 0 0 10px #1c1c1e;
    overflow: hidden;
  }
  .screen {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }

  .page-wrap {
    width: 375px;
    position: relative;
  }
  .page-wrap img.page {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* ============================================================
     CARE+ VIDEO CARD — sits to the right of the existing
     "What is Samsung Care+" banner in the Care+ section
     ============================================================ */
  .care-card-anchor {
    position: absolute;
    /* mirrors the existing banner's geometry:
       banner is at x 207–831, y 4438–4583 on the 1680×5937 page */
    left: 6.4%;      /* 24 / 375  */
    top: 62.894%;    /* 4919 / 7821 — just below the existing banner */
    width: 87.2%;    /* 327 / 375 — same width as the banner above it */
    z-index: 10;
    /* font-size is set by JS to scale 1:1 with the page screenshot;
       all card dimensions below are in em so the whole thing scales. */
    font-size: 13px;
  }

  .care-card {
    display: flex;
    align-items: center;
    width: 100%;
    height: 9.77em;            /* 127px at the screenshot's native width — same as the banner above */
    background: #f7f7f7;
    border-radius: 0.8em;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    text-align: left;

    transition: transform 0.18s ease;
  }
  .care-card:hover  { transform: scale(1.015); }
  .care-card:active { transform: scale(0.995); }

  .care-card .video-thumb {
    width: 7.7em;              /* ~100px — same footprint as the banner's photo */
    height: 100%;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
    background: #ededed;
    /* clicks pass through to the card */
    pointer-events: none;
  }
  /* fallback layer — shows if the YouTube embed can't load */
  .care-card .video-fallback {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5em;
    background: linear-gradient(160deg, #dcdbfa 0%, #d6e5ec 55%, #d3ece3 100%);
  }
  .care-card .video-fallback img { width: 2.2em; }
  .care-card .video-fallback .play {
    width: 0; height: 0;
    border-left: 0.9em solid #010101;
    border-top: 0.55em solid transparent;
    border-bottom: 0.55em solid transparent;
    margin-left: 0.2em;
  }
  .care-card .video-thumb iframe {
    /* oversize + centre the 9:16 player so it fills the tile edge to edge */
    position: absolute;
    top: 50%; left: 50%;
    width: 7.7em;
    height: 13.69em;           /* 7.7em × 16/9 */
    transform: translate(-50%, -50%);
    border: 0;
  }

  .care-card .card-text { flex: 1; min-width: 0; padding: 0 2.2em 0 1.0em; }
  .care-card .card-text h3 {
    font-size: 1em;            /* 13px at native width */
    font-weight: 700;
    color: #010101;
    letter-spacing: -0.1px;
    line-height: 1.27;
    margin-bottom: 0.4em;
  }
  .care-card .card-text p {
    font-size: 0.769em;        /* 10px at native width */
    color: #010101;
    line-height: 1.24;
  }

  .care-card .help {
    position: absolute;
    top: 0.9em;
    right: 1.05em;
    width: 1.35em;
    height: 1.35em;
    font-size: 0.95em;
    border: 1px solid #010101;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1em;
    font-weight: 600;
    color: #010101;
  }

  /* ============================================================
     POPUP / MODAL
     ============================================================ */
  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    padding: 24px;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .modal {
    background: #ffffff;
    border-radius: 16px;
    width: min(420px, 100%);
    max-height: calc(100% - 28px);
    overflow-y: auto;
    padding: 46px 22px 34px;
    position: relative;
    transform: translateY(24px) scale(0.97);
    transition: transform 0.35s cubic-bezier(0.22, 1.2, 0.36, 1);
  }
  .modal-overlay.open .modal {
    transform: translateY(0) scale(1);
  }

  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 30px;
    height: 30px;
    z-index: 2;
    border: none;
    background: none;
    cursor: pointer;
    padding: 4px;
  }
  .modal-close svg { width: 100%; height: 100%; }
  .modal-close:hover { opacity: 0.6; }

  .modal h2 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #010101;
    margin-bottom: 36px;
  }

  .modal .video-frame {
    width: min(240px, 62vw);
    aspect-ratio: 9 / 16;
    margin: 0 auto 40px;
    border-radius: 12px;
    overflow: hidden;
    background: #f4f6f8;
    box-shadow: 0 6px 24px rgba(0,0,0,0.12);
  }
  .modal .video-frame iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  .modal p {
    font-size: 15px;
    line-height: 1.5;
    color: #010101;
    max-width: 920px;
  }

  @media (max-width: 640px) {
    .modal { padding: 44px 26px 44px; }
  }
</style>
</head>

                  allow="autoplay; encrypted-media; picture-in-picture"></iframe>
        </div>
        <div class="card-text">
          <h3>Unexpected problem? Count on Samsung Care+</h3>
          <p>Drops, spills and gravity's little surprises &mdash; your Galaxy is covered for all of them, worldwide.</p>
        </div>
        <div class="help" aria-hidden="true">?</div>
      </div>
    </div>
  </div>
  </div><!-- /.screen -->

  <!-- Popup -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <button class="modal-close" id="modalClose" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="#010101" stroke-width="1.6" stroke-linecap="round">
          <line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/>
        </svg>
      </button>
      <h2 id="modalTitle">Samsung Care+ for your new Galaxy</h2>
      <div class="video-frame" id="videoFrame" data-src="https://www.youtube.com/embed/gzzMMt7KYTE?autoplay=1"></div>
      <p>Get peace of mind for your Samsung Galaxy, with worldwide cover designed by the people who made it.</p>
    </div>
  </div>

  </div><!-- /.phone -->

<script>
(function () {
  /* ------------------------------------------------------------
     CONFIG
     The card's position is set in CSS (.care-card-anchor).
     Tweak these to change when the reveal fires.
  ------------------------------------------------------------ */
  // (entrance animation removed — the card is part of the page from load)

  var card     = document.getElementById('careCard');
  var overlay  = document.getElementById('modalOverlay');
  var closeBtn = document.getElementById('modalClose');
  var videoFrame = document.getElementById('videoFrame');

  var cardVideo = document.getElementById('cardVideo');
  var cardSrc = cardVideo.getAttribute('src');

  /* ---------------- popup ---------------- */
  function openModal() {
    if (!videoFrame.querySelector('iframe')) {
      var f = document.createElement('iframe');
      f.src = videoFrame.getAttribute('data-src');
      f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      f.allowFullscreen = true;
      f.setAttribute('frameborder', '0');
      f.title = 'Samsung Care+ video';
      videoFrame.appendChild(f);
    }
    overlay.classList.add('open');
    document.getElementById('screen').style.overflow = 'hidden';
    // pause the eye-catcher while the popup is open
    cardVideo.setAttribute('src', '');
  }
  function closeModal() {
    overlay.classList.remove('open');
    document.getElementById('screen').style.overflow = '';
    var f = videoFrame.querySelector('iframe');
    if (f) f.remove();
    // resume the muted video in the card
    cardVideo.setAttribute('src', cardSrc);
  }

  card.addEventListener('click', openModal);
  card.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(); }
  });
  closeBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });
})();
</script>
</body>
</html>
