<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samsung Care+ Image Card — Interactive Prototype</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #ffffff;
    font-family: "SamsungOne", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page-wrap {
    max-width: 1680px;
    margin: 0 auto;
    position: relative;
  }
  .page-wrap img.page {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* ============================================================
     CARE+ VIDEO CARD — sits to the right of the existing
     "What is Samsung Care+" banner in the Care+ section
     ============================================================ */
  .care-card-anchor {
    position: absolute;
    /* mirrors the existing banner's geometry:
       banner is at x 207–831, y 4438–4583 on the 1680×5937 page */
    left: 51.25%;    /* 861 / 1680  */
    top: 75.594%;    /* 4488 / 5937 — same top as the banner beside it */
    width: 37.143%;  /* 624 / 1680 — same width as the banner beside it */
    z-index: 10;
    /* font-size is set by JS to scale 1:1 with the page screenshot;
       all card dimensions below are in em so the whole thing scales. */
    font-size: 14px;
  }

  .care-card {
    display: flex;
    align-items: center;
    width: 100%;
    height: 6.857em;           /* 96px at the screenshot's native width — same as the banner */
    background: #f7f7f7;
    border-radius: 0.8em;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    text-align: left;

    transition: transform 0.18s ease;
  }
  .care-card:hover  { transform: scale(1.015); }
  .care-card:active { transform: scale(0.995); }

  .care-card .video-thumb {
    width: 9.857em;            /* ~138px — same footprint as the banner's photo */
    height: 100%;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
    background: #ededed;
    /* clicks pass through to the card */
    pointer-events: none;
  }
  .care-card .video-thumb .thumb-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 20%;
  }
  /* play badge — same style as the banner beside it */
  .care-card .video-thumb .play-badge {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 2.3em;
    height: 2.3em;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 1px 6px rgba(0,0,0,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .care-card .video-thumb .play-badge::after {
    content: '';
    width: 0; height: 0;
    border-left: 0.7em solid #1a1a1a;
    border-top: 0.45em solid transparent;
    border-bottom: 0.45em solid transparent;
    margin-left: 0.15em;
  }

  .care-card .card-text { flex: 1; min-width: 0; padding: 0 2.6em 0 1.35em; }
  .care-card .card-text h3 {
    font-size: 1em;            /* 14px at native width */
    font-weight: 700;
    color: #010101;
    letter-spacing: -0.1px;
    line-height: 1.27;
    margin-bottom: 0.4em;
  }
  .care-card .card-text p {
    font-size: 0.857em;        /* 12px at native width */
    color: #010101;
    line-height: 1.24;
  }

  .care-card .help {
    position: absolute;
    top: 0.9em;
    right: 1.05em;
    width: 1.35em;
    height: 1.35em;
    font-size: 0.95em;
    border: 1px solid #010101;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1em;
    font-weight: 600;
    color: #010101;
  }

  /* ============================================================
     POPUP / MODAL
     ============================================================ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    padding: 24px;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .modal {
    background: #ffffff;
    border-radius: 18px;
    width: min(1080px, 100%);
    max-height: calc(100vh - 48px);
    overflow-y: auto;
    padding: 56px 72px 64px;
    position: relative;
    transform: translateY(24px) scale(0.97);
    transition: transform 0.35s cubic-bezier(0.22, 1.2, 0.36, 1);
  }
  .modal-overlay.open .modal {
    transform: translateY(0) scale(1);
  }

  .modal-close {
    position: absolute;
    top: 30px;
    right: 34px;
    width: 36px;
    height: 36px;
    border: none;
    background: none;
    cursor: pointer;
    padding: 4px;
  }
  .modal-close svg { width: 100%; height: 100%; }
  .modal-close:hover { opacity: 0.6; }

  .modal h2 {
    font-size: clamp(26px, 3.4vw, 40px);
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #010101;
    margin-bottom: 36px;
  }

  .modal .video-frame {
    width: min(300px, 70vw);
    aspect-ratio: 9 / 16;
    margin: 0 auto 40px;
    border-radius: 12px;
    overflow: hidden;
    background: #f4f6f8;
    box-shadow: 0 6px 24px rgba(0,0,0,0.12);
  }
  .modal .video-frame iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  .modal p {
    font-size: 19px;
    line-height: 1.5;
    color: #010101;
    max-width: 920px;
  }

  @media (max-width: 640px) {
    .modal { padding: 44px 26px 44px; }
  }
</style>
</head>

      <h2 id="modalTitle">Samsung Care+ for your new Galaxy</h2>
      <div class="video-frame" id="videoFrame" data-src="https://www.youtube.com/embed/gzzMMt7KYTE?autoplay=1"></div>
      <p>Get peace of mind for your Samsung Galaxy, with worldwide cover designed by the people who made it.</p>
    </div>
  </div>

<script>
(function () {
  /* ------------------------------------------------------------
     CONFIG
     The card's position is set in CSS (.care-card-anchor).
     Tweak these to change when the reveal fires.
  ------------------------------------------------------------ */
  // (entrance animation removed — the card is part of the page from load)

  var card     = document.getElementById('careCard');
  var overlay  = document.getElementById('modalOverlay');
  var closeBtn = document.getElementById('modalClose');
  var videoFrame = document.getElementById('videoFrame');

  /* ---------------- popup ---------------- */
  function openModal() {
    if (!videoFrame.querySelector('iframe')) {
      var f = document.createElement('iframe');
      f.src = videoFrame.getAttribute('data-src');
      f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      f.allowFullscreen = true;
      f.setAttribute('frameborder', '0');
      f.title = 'Samsung Care+ video';
      videoFrame.appendChild(f);
    }
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    overlay.classList.remove('open');
    document.body.style.overflow = '';
    var f = videoFrame.querySelector('iframe');
    if (f) f.remove();
  }

  card.addEventListener('click', openModal);
  card.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(); }
  });
  closeBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });
})();
</script>
</body>
</html>
