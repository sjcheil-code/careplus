<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samsung Care+ Video Teaser — Mobile Prototype</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #ffffff;
    font-family: "SamsungOne", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .page-wrap {
    max-width: 375px;
    margin: 0 auto;
    position: relative;
  }
  .page-wrap img.page {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* ============================================================
     CARE+ VIDEO TEASER — live-commerce-sized card that slides in
     above the live commerce widget while the user is in the
     Samsung Care+ section
     ============================================================ */
  .care-teaser {
    position: fixed;
    left: 10px;
    bottom: 208px;             /* live commerce (188px tall) + 10px gap + 10px offset */
    width: 106px;
    z-index: 860;
    background: none;
    border: none;

    /* hidden off-screen to the left by default */
    transform: translateX(-140%);
    opacity: 0;
    /* exit: brisk slide back out */
    transition: transform 0.45s cubic-bezier(0.55, 0, 0.68, 0.19), opacity 0.35s ease;
    pointer-events: none;
  }
  .care-teaser.in {
    transform: translateX(0);
    opacity: 1;
    pointer-events: auto;
    /* entrance: slower, with a slight bounce at the end */
    transition: transform 0.9s cubic-bezier(0.34, 1.45, 0.5, 1), opacity 0.5s ease;
  }

  .care-teaser .teaser-close {
    position: absolute;
    top: 47px;                 /* just inside the top-right of the video tile */
    right: 4px;
    width: 16px;
    height: 16px;
    border: none;
    border-radius: 50%;
    background: #ffffff;
    color: #010101;
    font-size: 10px;
    line-height: 16px;
    text-align: center;
    cursor: pointer;
    z-index: 3;
    padding: 0;
  }

  .care-teaser .teaser-cta {
    display: flex;
    align-items: center;
    gap: 6px;
    width: max-content;        /* pill may be a little wider than the video */
    max-width: 160px;
    border: 1px solid #dcdcdc;
    border-radius: 999px;
    background: #ffffff;
    cursor: pointer;
    font-family: inherit;
    padding: 5px 16px 5px 13px;
    text-align: left;
    margin-bottom: 6px;
  }
  .care-teaser .teaser-cta img { width: 16px; flex-shrink: 0; }
  .care-teaser .teaser-cta span {
    font-size: 12px;
    font-weight: 700;
    color: #010101;
    line-height: 1.2;
    letter-spacing: -0.1px;
  }

  .care-teaser .teaser-video {
    position: relative;
    margin: 0;
    height: 150px;
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    overflow: hidden;
    background: #ededed;
    cursor: pointer;
  }
  .care-teaser .teaser-video > * { pointer-events: none; }
  .care-teaser .teaser-fallback {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: linear-gradient(160deg, #dcdbfa 0%, #d6e5ec 55%, #d3ece3 100%);
  }
  .care-teaser .teaser-fallback img { width: 26px; }
  .care-teaser .teaser-fallback .play {
    width: 0; height: 0;
    border-left: 11px solid #010101;
    border-top: 7px solid transparent;
    border-bottom: 7px solid transparent;
    margin-left: 3px;
  }
  .care-teaser .teaser-video iframe {
    /* oversize + centre the 9:16 player so it fills the tile */
    position: absolute;
    top: 50%; left: 50%;
    width: 106px;
    height: 189px;             /* 106 × 16/9 */
    transform: translate(-50%, -50%);
    border: 0;
  }

  /* ============================================================
     STICKY WIDGETS — live commerce (bottom-left) & chat (right)
     Anchored to the 375px page column when viewed on wider screens.
     ============================================================ */
  .live-widget {
    position: fixed;
    left: 10px;
    bottom: 10px;
    width: 106px;
    z-index: 850;
    cursor: pointer;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    opacity: 0;
    transform: translateY(16px);
    animation: widgetIn 0.5s ease 0.4s forwards;
  }
  .live-widget img { display: block; width: 100%; height: auto; }

  .chat-widget {
    position: fixed;
    right: 15px;
    bottom: 200px;
    width: 56px;
    height: 56px;
    z-index: 850;
    cursor: pointer;
    opacity: 0;
    transform: translateY(16px);
    animation: widgetIn 0.5s ease 0.6s forwards;
  }
  .chat-widget img { display: block; width: 100%; height: auto; }

  @keyframes widgetIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* keep the widgets glued to the phone-width column on wider screens */
  @media (min-width: 376px) {
    .live-widget  { left: calc(50vw - 187.5px + 10px); }
    .care-teaser  { left: calc(50vw - 187.5px + 10px); }
    .chat-widget  { right: calc(50vw - 187.5px + 15px); }
  }

  /* ============================================================
     STICKY BUY BAR — pinned to the bottom, slight shadow,
     sits BEHIND the live commerce and chat widgets (lower z-index)
     ============================================================ */
  .buy-bar {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 375px;
    max-width: 100vw;
    z-index: 800;              /* live commerce & chat are 850 */
    background: #ffffff;
    box-shadow: 0 -4px 14px rgba(0, 0, 0, 0.10);
  }
  .buy-bar img { display: block; width: 100%; height: auto; }

  /* ============================================================
     POPUP / MODAL (mobile-friendly)
     ============================================================ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    padding: 14px;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .modal {
    background: #ffffff;
    border-radius: 16px;
    width: min(420px, 100%);
    max-height: calc(100vh - 28px);
    overflow-y: auto;
    padding: 46px 22px 34px;
    position: relative;
    transform: translateY(24px) scale(0.97);
    transition: transform 0.35s cubic-bezier(0.22, 1.2, 0.36, 1);
  }
  .modal-overlay.open .modal {
    transform: translateY(0) scale(1);
  }

  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 30px;
    height: 30px;
    border: none;
    background: none;
    cursor: pointer;
    padding: 4px;
    z-index: 2;
  }
  .modal-close svg { width: 100%; height: 100%; }

  .modal h2 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.4px;
    color: #010101;
    margin-bottom: 20px;
  }

  .modal .video-frame {
    width: min(240px, 62vw);
    aspect-ratio: 9 / 16;
    margin: 0 auto 22px;
    border-radius: 12px;
    overflow: hidden;
    background: #f4f6f8;
    box-shadow: 0 6px 24px rgba(0,0,0,0.12);
  }
  .modal .video-frame iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  .modal p {
    font-size: 15px;
    line-height: 1.5;
    color: #010101;
  }
</style>
</head>

  <!-- Popup -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <button class="modal-close" id="modalClose" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="#010101" stroke-width="1.6" stroke-linecap="round">
          <line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/>
        </svg>
      </button>
      <h2 id="modalTitle">Samsung Care+ for your new Galaxy</h2>
      <div class="video-frame" id="videoFrame" data-src="https://www.youtube.com/embed/gzzMMt7KYTE?autoplay=1"></div>
      <p>Get peace of mind for your Samsung Galaxy, with worldwide cover designed by the people who made it.</p>
    </div>
  </div>

<script>
(function () {
  /* ------------------------------------------------------------
     CONFIG — Samsung Care+ section position on the mobile page,
     as fractions of the page screenshot height (375×7786).
  ------------------------------------------------------------ */
  var CARE_START_FRAC = 0.5350;    // top of "Samsung Care+" section (~y4165)
  var CARE_END_FRAC   = 0.6422;    // bottom of section (~y5000, before "Buy direct. Get more.")
  var REVEAL_VIEWPORT_FRAC = 0.60; // section top must rise above this fraction of the viewport

  var teaser   = document.getElementById('careTeaser');
  var teaserFrame = document.getElementById('teaserFrame');
  var teaserClosed = false;
  var pageImg  = document.getElementById('pageImg');
  var overlay  = document.getElementById('modalOverlay');
  var closeBtn = document.getElementById('modalClose');
  var videoFrame = document.getElementById('videoFrame');
  var chatWidget = document.getElementById('chatWidget');

  var state = 'hidden';
  var stopTimer = null;

  function sectionBounds() {
    var rect = pageImg.getBoundingClientRect();
    var imgTop = rect.top + window.scrollY;
    var h = pageImg.offsetHeight;
    return {
      top:    imgTop + h * CARE_START_FRAC,
      bottom: imgTop + h * CARE_END_FRAC
    };
  }

  function shouldShow() {
    var b = sectionBounds();
    var vh = window.innerHeight;
    var reachedSection  = (window.scrollY + vh * REVEAL_VIEWPORT_FRAC) >= b.top;
    var notPastSection  = window.scrollY <= b.bottom;
    return reachedSection && notPastSection;
  }

  function showTeaser() {
    if (teaserClosed || state === 'shown') return;
    clearTimeout(stopTimer);
    // start the muted video as it slides in
    if (!teaserFrame.getAttribute('src')) {
      teaserFrame.setAttribute('src', teaserFrame.getAttribute('data-src'));
    }
    teaser.classList.add('in');
    teaser.setAttribute('aria-hidden', 'false');
    state = 'shown';
  }

  function hideTeaser() {
    if (state === 'hidden') return;
    teaser.classList.remove('in');
    teaser.setAttribute('aria-hidden', 'true');
    state = 'hidden';
    // stop playback once the slide-out finishes
    clearTimeout(stopTimer);
    stopTimer = setTimeout(function () {
      if (state === 'hidden') teaserFrame.setAttribute('src', '');
    }, 550);
  }

  function onScroll() {
    if (shouldShow()) { showTeaser(); } else { hideTeaser(); }
  }

  var ticking = false;
  window.addEventListener('scroll', function () {
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(function () { onScroll(); ticking = false; });
    }
  }, { passive: true });
  window.addEventListener('resize', onScroll);
  window.addEventListener('load', onScroll);
  onScroll();

  /* ---------------- chat widget: X in the corner dismisses it ---------------- */
  chatWidget.addEventListener('click', function (e) {
    var r = chatWidget.getBoundingClientRect();
    // the close X occupies the top-right corner of the asset
    if (e.clientX > r.right - 22 && e.clientY < r.top + 22) {
      chatWidget.style.display = 'none';
    }
  });

  /* ---------------- popup ---------------- */
  function openModal() {
    if (!videoFrame.querySelector('iframe')) {
      var f = document.createElement('iframe');
      f.src = videoFrame.getAttribute('data-src');
      f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      f.allowFullscreen = true;
      f.setAttribute('frameborder', '0');
      f.title = 'Samsung Care+ video';
      videoFrame.appendChild(f);
    }
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    teaserFrame.setAttribute('src', '');
  }
  function closeModal() {
    overlay.classList.remove('open');
    document.body.style.overflow = '';
    var f = videoFrame.querySelector('iframe');
    if (f) f.remove();
    if (state === 'shown' && !teaserClosed) {
      teaserFrame.setAttribute('src', teaserFrame.getAttribute('data-src'));
    }
  }

  document.getElementById('teaserCta').addEventListener('click', openModal);
  document.getElementById('teaserVideo').addEventListener('click', openModal);
  document.getElementById('teaserClose').addEventListener('click', function (e) {
    e.stopPropagation();
    teaserClosed = true;
    hideTeaser();
  });
  closeBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) closeModal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });
})();
</script>
